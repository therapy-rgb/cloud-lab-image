name: build
on:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: "0 6 * * 1" }]  # weekly, to pick up exeuntu and Rex updates
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/therapy-rgb/cloud-lab-image:latest,ghcr.io/therapy-rgb/cloud-lab-image:${{ github.sha }}
